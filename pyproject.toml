[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budongsan-tax"
version = "0.1.0"
description = "Korean real-estate tax engine and MCP server: statute nodes, official rulings as tests"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "mcp-server", "model-context-protocol", "korea", "tax", "real-estate", "양도소득세", "취득세", "종합부동산세"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Intended Audience :: Developers",
]
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27.0", "python-dotenv>=1.0.0", "xmltodict>=0.13.0", "pydantic>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/taylee9809/budongsan-tax"
Repository = "https://github.com/taylee9809/budongsan-tax"
Issues = "https://github.com/taylee9809/budongsan-tax/issues"

[project.scripts]
budongsan-tax = "budongsan_tax.tax_server:main"

# 저장소는 평면 모듈(tax_params 등)이다. 설치본에서는 저장소 루트 전체가 budongsan_tax 패키지가 되고,
# 루트 __init__.py가 패키지 디렉터리를 sys.path 앞에 넣어 저장소에서 쓰던 import가 그대로 풀린다.
# data/ 는 하위 패키지로 묶여 tax_params.py 등의 "<모듈 옆>/data" 경로가 설치 뒤에도 같다.
[tool.setuptools]
include-package-data = true
packages = ["budongsan_tax", "budongsan_tax.tax_nodes", "budongsan_tax.data", "budongsan_tax.data.legal_nodes", "budongsan_tax.data.verification"]

[tool.setuptools.package-dir]
budongsan_tax = "."

[tool.setuptools.package-data]
"budongsan_tax.data" = ["*.json"]
"budongsan_tax.data.legal_nodes" = ["*.json"]
"budongsan_tax.data.verification" = ["*.jsonl", "*.py"]
budongsan_tax = ["*.sql", "*.txt", "*.md", ".env.example", "llms.txt", "server.json"]
